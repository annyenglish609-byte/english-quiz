<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英文練習區</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFDF7;
    --card:#ffffff;
    --blue:#6FA8DC;        /* 主色 */
    --blue-deep:#4a86c4;
    --blue2:#A4C2F4;       /* 次色 */
    --blue2-soft:#eaf1fd;
    --teal:#76A5AF;        /* 按鈕 */
    --teal-deep:#5f8d96;
    --peach:#FBE6C9;
    --peach-line:#f4d5a8;
    --ink:#454c57;
    --soft-ink:#5d6573;
    --muted:#9aa3b0;
    --line:#eee7d8;
    --ok:#5bb98b;
    --ok-soft:#e9f7ef;
    --bad:#ef8e7d;
    --bad-soft:#fdeee9;
    --r:18px;
    --r-sm:12px;
    --shadow:0 6px 20px rgba(120,130,150,.10);
    --shadow-sm:0 3px 10px rgba(120,130,150,.10);
    /* 字型：中文圓體優先 + 英文 Comic Sans 優先 */
    --zh:"華康細圓體","Microsoft JhengHei","Noto Sans TC","Baloo 2",sans-serif;
    --en:"Comic Sans MS","Comic Sans","華康細圓體","Baloo 2","Microsoft JhengHei","Noto Sans TC",cursive,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--zh);font-size:16px;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  .hidden{display:none!important}
  ::selection{background:var(--blue2);color:#fff}

  /* ============ Header ============ */
  header.bar{position:sticky;top:0;z-index:40;background:rgba(255,253,247,.9);backdrop-filter:blur(8px);border-bottom:2px solid var(--line)}
  .bar-in{max-width:1180px;margin:0 auto;padding:0 22px;height:62px;display:flex;align-items:center;gap:14px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand .logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--blue),var(--blue2));
    display:grid;place-items:center;font-size:21px;box-shadow:var(--shadow-sm)}
  .brand b{font-size:20px;font-weight:700;color:var(--blue-deep);letter-spacing:1px}
  .bar .grow{flex:1}
  .hi{font-size:15px;color:var(--soft-ink);white-space:nowrap}
  .hi b{color:var(--blue-deep)}
  .pill-btn{background:#fff;color:var(--teal-deep);border:2px solid var(--line);padding:8px 16px;border-radius:999px;
    font-size:14px;font-weight:500;transition:.18s;white-space:nowrap}
  .pill-btn:hover{border-color:var(--teal);color:var(--teal);transform:translateY(-1px)}
  .pill-btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}
  .pill-btn.teal:hover{background:var(--teal-deep);color:#fff}
  .pill-btn.on{background:#fff3da;border-color:var(--peach-line);color:#b07c2e}

  .wrap{max-width:1180px;margin:0 auto;padding:0 22px}

  /* ============ Welcome ============ */
  #start{max-width:540px;margin:50px auto 0;text-align:center}
  .hero-emoji{font-size:60px;line-height:1;margin-bottom:6px;animation:bob 2.6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-9px) rotate(4deg)}}
  #start h1{font-family:var(--en);font-size:28px;font-weight:700;color:var(--blue-deep);margin:6px 0 8px;letter-spacing:.5px}
  #start .sub{font-size:16px;color:var(--soft-ink);margin-bottom:26px}
  .wcard{background:var(--card);border:2px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:30px 32px 34px}
  .field{text-align:left;margin-bottom:18px}
  .field label{display:block;font-size:15px;color:var(--soft-ink);font-weight:500;margin-bottom:8px}
  .field input{width:100%;font-family:var(--zh);font-size:18px;color:var(--ink);border:2px solid var(--line);
    border-radius:14px;padding:14px 16px;background:#fffefb;transition:.18s}
  .field input::placeholder{color:#c4c9d1}
  .field input:focus{outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px var(--blue2-soft)}
  .field.err input{border-color:var(--bad);background:var(--bad-soft)}
  .range-label{text-align:left;font-size:14px;color:var(--muted);margin:2px 0 10px}
  .pills{display:flex;gap:9px;margin-bottom:26px}
  .pills button{flex:1;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 6px;
    font-size:15px;color:var(--soft-ink);font-weight:500;transition:.18s}
  .pills button .c{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
  .pills button:hover{border-color:var(--blue2);transform:translateY(-2px)}
  .pills button.on{background:var(--blue2-soft);border-color:var(--blue);color:var(--blue-deep)}
  .big-btn{width:100%;background:var(--teal);color:#fff;border:0;border-radius:16px;padding:16px;
    font-family:var(--en);font-size:19px;font-weight:600;letter-spacing:1px;box-shadow:0 5px 14px rgba(118,165,175,.35);transition:.18s}
  .big-btn:hover{background:var(--teal-deep);transform:translateY(-2px);box-shadow:0 8px 20px rgba(118,165,175,.42)}
  .big-btn:active{transform:translateY(0)}
  .resume-note{margin-top:16px;font-size:14px;color:var(--soft-ink)}
  .resume-note a{color:var(--blue-deep);cursor:pointer;font-weight:600;text-decoration:underline}

  /* ===== 選題系統 ===== */
  .pick-title{font-family:var(--en);font-size:18px;font-weight:700;color:var(--blue-deep);text-align:center;margin:4px 0 18px}
  .pick-row{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .pick-lab{font-size:14px;color:var(--soft-ink);font-weight:500;white-space:nowrap}
  .miniseg{display:flex;flex:1;border:2px solid var(--line);border-radius:12px;overflow:hidden}
  .miniseg button{flex:1;background:#fff;border:0;border-right:1px solid var(--line);padding:10px 4px;font-size:14px;color:var(--soft-ink);font-weight:500;transition:.15s}
  .miniseg button:last-child{border-right:0}
  .miniseg button.on{background:var(--blue);color:#fff}
  .type-card{border:2px solid var(--line);border-radius:16px;margin-bottom:13px;overflow:hidden;background:#fff;transition:.18s}
  .type-card.off{opacity:.5;background:#fbfaf7}
  .type-head{display:flex;align-items:center;gap:11px;padding:14px 16px;cursor:pointer;user-select:none}
  .type-head input{width:22px;height:22px;accent-color:var(--blue);cursor:pointer;flex:none}
  .type-head .tch{font-family:var(--en);font-size:16.5px;font-weight:600;color:var(--ink);flex:1}
  .type-head .tcount{font-size:13px;color:var(--muted);background:#f3f0e8;padding:3px 10px;border-radius:999px}
  .type-body{padding:0 16px 15px 49px}
  .type-card.off .type-body{display:none}
  .qbtns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .qp{background:#fff;border:2px solid var(--line);border-radius:10px;padding:8px 15px;font-size:14px;color:var(--soft-ink);font-weight:500;transition:.15s}
  .qp:hover{border-color:var(--blue2);transform:translateY(-1px)}
  .qp.on{background:var(--blue2-soft);border-color:var(--blue);color:var(--blue-deep)}
  .custom-range{font-size:14px;color:var(--soft-ink);display:flex;align-items:center;gap:8px;margin-top:6px}
  .custom-range input{width:74px;font-family:var(--sans);font-size:15px;border:2px solid var(--line);border-radius:9px;padding:8px 10px;text-align:center}
  .custom-range input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue2-soft)}
  .special{border-top:2px dashed var(--line);margin-top:16px;padding-top:14px;display:flex;flex-direction:column;gap:11px}
  .special .sp{display:flex;align-items:center;gap:9px;font-size:14.5px;color:var(--soft-ink);cursor:pointer}
  .special .sp input[type=checkbox]{width:20px;height:20px;accent-color:var(--teal);cursor:pointer}
  .special .rand-n{width:58px;font-family:var(--sans);font-size:15px;border:2px solid var(--line);border-radius:8px;padding:6px 8px;text-align:center}
  .special .wcount{color:var(--muted);font-size:13px}
  .summary{margin:18px 0 16px;padding:14px 16px;background:var(--blue2-soft);border:2px solid var(--blue2);border-radius:14px;
    text-align:center;font-size:15px;color:var(--blue-deep);font-weight:500;line-height:1.7}
  .summary b{font-family:var(--en);font-size:20px;color:var(--blue-deep)}
  .summary.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}

  .loading{text-align:center;color:var(--muted);padding:50px 20px;font-size:15px}
  .filebox{max-width:480px;margin:26px auto;background:#fff;border:2px solid var(--line);border-radius:20px;padding:26px;box-shadow:var(--shadow);text-align:left}
  .filebox h3{font-family:var(--en);color:var(--blue-deep);margin:0 0 6px}
  .filebox p{font-size:14px;color:var(--soft-ink);line-height:1.7}
  .filebox label{display:block;font-size:14px;margin:14px 0 4px;color:var(--soft-ink)}

  /* ============ Quiz top strip ============ */
  .strip{position:sticky;top:62px;z-index:30;background:var(--bg);border-bottom:2px solid var(--line)}
  .strip-in{max-width:1180px;margin:0 auto;padding:5px 22px;display:flex;align-items:center;gap:12px}
  .chip{height:24px;display:inline-flex;align-items:center;font-size:12.5px;font-weight:600;padding:0 11px;border-radius:999px;white-space:nowrap;font-family:var(--zh);line-height:1;align-self:center;flex:none}
  .chip.cloze{background:#eaf7f0;color:#3f9e6e}
  .chip.read{background:#fdf1e3;color:#c08a3e}
  .chip.exam{background:#eef3fb;color:var(--blue-deep);display:inline-flex;align-items:center;height:24px;padding:0 11px}
  .pbar-wrap{flex:1;display:flex;align-items:center;gap:10px;min-width:80px}
  .pbar{flex:1;height:8px;background:#f0ead9;border-radius:999px;overflow:hidden}
  .pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue2),var(--blue));border-radius:999px;transition:width .4s ease}
  .pcount{font-size:14px;color:var(--soft-ink);font-weight:600;white-space:nowrap}
  .cheer{font-size:13px;color:var(--teal);white-space:nowrap}

  /* ============ Two-column 70 / 30 ============ */
  .exam{display:grid;grid-template-columns:69% 31%;gap:22px;padding:12px 0 50px;align-items:start}
  .article{background:var(--card);border:2px solid var(--line);border-radius:22px;box-shadow:var(--shadow);
    padding:30px 40px 38px;min-height:300px}
  .article .top{display:flex;align-items:center;gap:9px;margin-bottom:16px}
  .article .top .n{font-family:var(--en);color:var(--blue-deep);font-weight:700;font-size:18px}
  .article .top .deco{flex:1;height:3px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--blue2) 0 14px,transparent 14px 22px);opacity:.5}
  .passage{font-family:var(--en);line-height:2.0;color:#3f4753;font-size:18px;white-space:pre-wrap;word-break:normal;
    -webkit-hyphens:auto;hyphens:auto}
  .passage.reading{font-size:17px}
  .passage p{margin:0 0 1.5em}
  .passage p:last-child{margin-bottom:0}
  .passage .img-note{font-family:var(--zh);font-size:15px;color:var(--soft-ink);background:#fffaf0;
    border:2px dashed var(--peach-line);border-radius:14px;padding:18px;text-align:center;line-height:1.8}
  .passage .pimg{display:block;max-width:100%;height:auto;margin:14px auto;border:1px solid var(--line);
    border-radius:12px;box-shadow:var(--shadow-sm);background:#fff}
  /* friendly blank */
  .bk{display:inline-flex;align-items:center;justify-content:center;min-width:2.1em;height:1.5em;padding:0 .45em;margin:0 .15em;
    background:var(--blue2-soft);border:2px solid var(--blue2);border-radius:9px;color:var(--blue-deep);
    font-family:var(--en);font-weight:700;font-size:.78em;vertical-align:1px}

  /* answer column */
  .answers{position:sticky;top:104px}
  .ans-inner{background:var(--card);border:2px solid var(--line);border-radius:22px;box-shadow:var(--shadow);
    max-height:calc(100vh - 156px);overflow:auto}
  .ans-head{font-family:var(--en);font-size:16px;color:var(--blue-deep);font-weight:700;
    padding:16px 20px;border-bottom:2px solid var(--line);position:sticky;top:0;background:var(--card);z-index:1;display:flex;align-items:center;gap:8px}
  .ans-head .dot{font-size:18px}
  .qitem{padding:16px 20px;border-bottom:2px solid var(--line)}
  .qitem:last-child{border-bottom:0}
  .qhead{font-size:18px;font-weight:500;color:var(--ink);margin-bottom:11px;line-height:1.6;display:flex;gap:9px;align-items:flex-start}
  .qhead .qn{flex:none;min-width:28px;height:28px;padding:0 6px;border-radius:9px;background:#f0ead9;color:var(--muted);
    font-family:var(--en);font-size:14px;font-weight:700;display:grid;place-items:center;transition:.18s}
  .qhead .qn.done{background:var(--ok);color:#fff}
  .qhead .qen{font-family:var(--en)}
  .qhead .qimg{display:inline-block;max-height:2em;max-width:60%;vertical-align:middle;margin:0 4px;
    border:1px solid var(--line);border-radius:6px;background:#fff}
  .choice{display:flex;align-items:flex-start;gap:11px;padding:11px 13px;margin:7px 0;border:2px solid var(--line);
    border-radius:14px;cursor:pointer;transition:.16s;background:#fff;position:relative}
  .choice:hover{border-color:var(--blue2);background:#fafcff;transform:translateY(-1px)}
  .choice input{position:absolute;opacity:0;width:0;height:0}
  .choice .rl{width:26px;height:26px;border-radius:50%;border:2px solid #d6dbe2;flex:none;display:grid;place-items:center;
    font-family:var(--en);font-size:13.5px;font-weight:700;color:var(--muted);transition:.16s}
  .choice .ct{font-family:var(--en);font-size:17px;line-height:1.55;padding-top:2px;color:#3f4753}
  .choice .ct .oimg{display:block;max-width:100%;height:auto;border-radius:8px;border:1px solid var(--line);margin:2px 0}
  .choice.sel{border-color:var(--blue);background:var(--blue2-soft)}
  .choice.sel .rl{background:var(--blue);border-color:var(--blue);color:#fff}
  /* graded */
  .choice.correct{border-color:var(--ok);background:var(--ok-soft)}
  .choice.correct .rl{background:var(--ok);border-color:var(--ok);color:#fff}
  .choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
  .choice.wrong .rl{background:var(--bad);border-color:var(--bad);color:#fff}
  .choice.key{border-color:var(--ok);border-style:dashed}
  .verdict{font-size:14px;font-weight:600;margin:9px 0 0;font-family:var(--zh)}
  .verdict.r{color:var(--ok)} .verdict.w{color:var(--bad)}
  .explain{margin-top:10px;padding:12px 14px;background:#fffaf0;border:2px solid var(--peach-line);border-radius:12px;
    font-family:var(--zh);font-size:14px;line-height:1.8;color:#6d6253}
  .explain b{color:#b07c2e}

  /* nav */
  .navfoot{display:flex;align-items:center;gap:12px;padding:0 0 60px;flex-wrap:wrap}
  .nav-btn{background:#fff;border:2px solid var(--line);color:var(--teal-deep);padding:13px 22px;border-radius:14px;
    font-family:var(--en);font-size:16px;font-weight:600;transition:.18s}
  .nav-btn:hover:not(:disabled){border-color:var(--teal);color:var(--teal);transform:translateY(-2px)}
  .nav-btn:disabled{opacity:.4;cursor:not-allowed}
  .nav-btn.primary{background:var(--teal);border-color:var(--teal);color:#fff;margin-left:auto;box-shadow:0 4px 12px rgba(118,165,175,.3)}
  .nav-btn.primary:hover{background:var(--teal-deep);color:#fff}
  .jump{font-size:14px;color:var(--soft-ink)}
  .jump select{font-family:var(--zh);font-size:14px;border:2px solid var(--line);border-radius:11px;padding:9px 10px;color:var(--ink);background:#fff;max-width:210px}

  /* ============ Result ============ */
  #result{max-width:600px;margin:46px auto 80px;text-align:center}
  .congrats-emoji{font-size:56px;animation:pop .5s ease}
  @keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
  #result h2{font-family:var(--en);font-size:28px;font-weight:700;color:var(--blue-deep);margin:6px 0 4px}
  #result .rstu{font-size:16px;color:var(--soft-ink);margin-bottom:22px}
  .rcard{background:var(--card);border:2px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:32px 30px}
  .ring-wrap{width:172px;height:172px;margin:0 auto 4px;position:relative}
  .ring-wrap svg{transform:rotate(-90deg)}
  .ring-c{position:absolute;inset:0;display:grid;place-content:center}
  .ring-c b{font-family:var(--en);font-size:44px;font-weight:700;line-height:1;color:var(--blue-deep)}
  .ring-c span{font-size:13px;color:var(--muted)}
  .cheer-msg{font-family:var(--en);font-size:21px;font-weight:600;margin:14px 0 4px;color:var(--teal-deep)}
  .sent-note{margin:10px auto 0;font-size:13.5px;color:var(--ok);background:var(--ok-soft);border:1.5px solid var(--ok);
    border-radius:999px;padding:7px 16px;display:inline-block;font-family:var(--zh)}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-top:20px}
  .stat{background:#fffaf0;border:2px solid var(--line);border-radius:16px;padding:16px 6px}
  .stat b{display:block;font-family:var(--en);font-size:27px;font-weight:700}
  .stat span{font-size:13px;color:var(--muted)}
  .stat.ok b{color:var(--ok)} .stat.bad b{color:var(--bad)} .stat.acc b{color:var(--blue-deep)}
  .rbtns{display:flex;gap:12px;margin-top:24px}
  .rbtns button{flex:1;padding:15px;border-radius:16px;font-family:var(--en);font-size:16px;font-weight:600;border:2px solid var(--line);background:#fff;color:var(--teal-deep);transition:.18s}
  .rbtns button:hover{border-color:var(--teal);color:var(--teal);transform:translateY(-2px)}
  .rbtns button.primary{background:var(--teal);border-color:var(--teal);color:#fff}
  .rbtns button.primary:hover{background:var(--teal-deep);color:#fff}

  /* ============ Modal ============ */
  .modal-bg{position:fixed;inset:0;background:rgba(80,90,110,.4);backdrop-filter:blur(3px);z-index:60;display:grid;place-items:center;padding:20px}
  .modal{background:#fff;border-radius:22px;box-shadow:0 20px 50px rgba(0,0,0,.2);width:100%;max-width:380px;overflow:hidden}
  .modal .mh{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;padding:20px 24px;font-family:var(--en);font-size:18px;font-weight:700}
  .modal .mb{padding:24px}
  .modal .mb p{margin:0 0 14px;font-size:14px;color:var(--soft-ink)}
  .modal input{width:100%;font-size:19px;letter-spacing:4px;text-align:center;border:2px solid var(--line);border-radius:14px;padding:13px;font-family:var(--zh)}
  .modal input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px var(--blue2-soft)}
  .modal .mbtns{display:flex;gap:10px;margin-top:18px}
  .modal .mbtns button{flex:1;padding:13px;border-radius:14px;font-size:15px;font-weight:600;font-family:var(--en);border:2px solid var(--line);background:#fff;color:var(--teal-deep)}
  .modal .mbtns button.primary{background:var(--teal);border-color:var(--teal);color:#fff}
  .modal .err-msg{color:var(--bad);font-size:13px;margin-top:8px;min-height:16px}

  .footer{text-align:center;padding:24px;color:var(--muted);font-size:13px}

  body.teacher .answers .ans-inner{box-shadow:0 0 0 3px #ffe2a8,var(--shadow)}
  .tbanner{display:none;background:#fff3da;border:2px solid var(--peach-line);color:#b07c2e;font-size:13.5px;
    padding:9px 14px;border-radius:12px;margin:0 0 12px;font-family:var(--zh)}
  body.teacher .tbanner{display:block}

  /* ============ Responsive ============ */
  @media(max-width:900px){
    .exam{grid-template-columns:1fr;gap:16px}
    .answers{position:static;top:auto}
    .ans-inner{max-height:none}
    .article{padding:24px 24px}
    .hi{display:none}
  }
  @media(max-width:520px){
    .bar-in{gap:8px;padding:0 14px}
    .stats{grid-template-columns:repeat(2,1fr)}
    .nav-btn.primary{margin-left:0;width:100%}
    .wcard{padding:24px}
  }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <div class="brand">
      <div class="logo">📚</div>
      <b>英文練習區</b>
    </div>
    <div class="grow"></div>
    <div class="hi hidden" id="hi"></div>
    <button class="pill-btn" id="teacherBtn">老師</button>
    <button class="pill-btn teal hidden" id="submitBtn">交卷</button>
  </div>
</header>

<!-- ============ WELCOME ============ -->

<script>
"use strict";

/* ===== 改這兩行：換成你的 GitHub（jsDelivr）題庫網址 ===== */
const BANK_URL = "question_bank.json";
const KEY_URL  = "answer_key.json";
/* ====================================================== */

/* ===== Google 表單回報（交卷後自動送出，學生看不到跳轉） =====
   欄位順序請對照你的表單： 姓名 / 練習範圍 / 總題數 / 答對 / 答錯 / 正確率 */
const GFORM = {
  id: "1FAIpQLSfju9Xa-AhLL2ud6hgNgvB7Gy7KAO093X-QD0upvQmZiqTlFg",
  fields: {
    name:    "entry.662434911",   // 姓名
    range:   "entry.1659652276",  // 練習範圍
    total:   "entry.598168858",   // 總題數
    correct: "entry.712365643",   // 答對
    wrong:   "entry.861464449",   // 答錯
    rate:    "entry.1814955045"   // 正確率
  }
};
/* ============================================================ */

const SKEY = "jhe_quiz_v3";
const TEACHER_PW = "123456";
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));

const S = {
  bank:null, key:null,
  student:{name:""},
  sessionIds:[],
  answers:{},
  groups:[], idx:0, total:0,
  submitted:false, teacher:false, review:false
};

const CHEERS=["加油，你可以的！","做得很好，繼續！","太棒了，保持下去！","越來越順手囉！","你超專心的！"];

/* ---------- persistence ---------- */
function save(){
  try{ localStorage.setItem(SKEY, JSON.stringify({
    student:S.student, sessionIds:[...(S.sessionIds instanceof Set?S.sessionIds:S.sessionIds||[])],
    answers:S.answers, idx:S.idx, submitted:S.submitted, started:S.groups.length>0
  })); }catch(e){}
}
function loadSaved(){ try{ return JSON.parse(localStorage.getItem(SKEY)||"null"); }catch(e){ return null; } }

/* ---------- data load ---------- */
async function boot(){
  try{
    const [b,k]=await Promise.all([
      fetch(BANK_URL).then(r=>{if(!r.ok)throw 0;return r.json();}),
      fetch(KEY_URL ).then(r=>{if(!r.ok)throw 0;return r.json();})
    ]);
    onData(b,k);
  }catch(e){
    $("#loading").classList.add("hidden");
    $("#fileBox").classList.remove("hidden");
  }
}
function onData(bank,key){
  S.bank=bank; S.key=key;
  $("#loading").classList.add("hidden");
  $("#fileBox").classList.add("hidden");
  setupPicker();
  const sv=loadSaved();
  if(sv && sv.started && sv.student && sv.student.name){
    $("#resumeNote").innerHTML='嗨 '+escapeHtml(sv.student.name)+'，上次還沒做完喔　<a id="resumeLink">繼續挑戰 →</a>';
    $("#resumeLink").addEventListener("click",()=>resume(sv));
  }
}
$("#fLoad").addEventListener("click",async()=>{
  const fb=$("#fBank").files[0], fk=$("#fKey").files[0];
  if(!fb||!fk){alert("請同時選取兩個 JSON 檔");return;}
  try{ onData(JSON.parse(await fb.text()), JSON.parse(await fk.text())); }
  catch(e){ alert("讀取失敗："+e); }
});

/* ---------- helpers ---------- */
function escapeHtml(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function renderText(t){
  if(!t) return '';
  let h=escapeHtml(t).replace(/___\((\d+)\)___/g,'<span class="bk">$1</span>');
  return h.split(/\n+/).filter(s=>s.trim()).map(p=>'<p>'+p+'</p>').join("");
}
function renderOption(v){
  const m=/\u27e6IMG\u27e7([\s\S]*?)\u27e6\/IMG\u27e7/.exec(v||"");
  if(m) return '<img class="oimg" src="'+m[1]+'" alt="選項圖片" loading="lazy">';
  return escapeHtml(v||"");
}
function renderStem(v){
  if(!v) return "請選擇正確答案";
  const IMG=/\u27e6IMG\u27e7([\s\S]*?)\u27e6\/IMG\u27e7/g;
  let out="",last=0,m;
  while((m=IMG.exec(v))){
    out+=escapeHtml(v.slice(last,m.index));
    out+='<img class="qimg" src="'+m[1]+'" alt="題目圖片">';
    last=m.index+m[0].length;
  }
  out+=escapeHtml(v.slice(last));
  return out;
}
function renderPassage(text){
  if(text && text.indexOf("〔本題組原文")===0)
    return '<div class="img-note">'+escapeHtml(text)+'</div>';
  const IMG=/\u27e6IMG\u27e7([\s\S]*?)\u27e6\/IMG\u27e7/g;
  let html='',last=0,m;
  while((m=IMG.exec(text||""))){
    html+=renderText(text.slice(last,m.index));
    html+='<img class="pimg" src="'+m[1]+'" alt="閱讀測驗圖片" loading="lazy">';
    last=m.index+m[0].length;
  }
  html+=renderText((text||"").slice(last));
  return html;
}
const LETT=["A","B","C","D","E","F"];

/* ---------- build session ---------- */
/* ===== 選題系統 ===== */
function typeGroups(section,exam){
  const seen=new Set(),arr=[];
  for(const q of S.bank){
    if(q.section!==section) continue;
    if(exam!=="all" && q.exam!==exam) continue;
    if(!seen.has(q.group)){ seen.add(q.group); arr.push(q.group); }
  }
  return arr;
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function getWrongIds(){ try{return new Set(JSON.parse(localStorage.getItem("jhe_wrong")||"[]"));}catch(e){return new Set();} }
function addWrongIds(ids){
  const cur=getWrongIds(); ids.forEach(i=>cur.add(i));
  try{localStorage.setItem("jhe_wrong",JSON.stringify([...cur]));}catch(e){}
}
function currentExam(){ const b=$("#examSeg .on"); return b?b.dataset.ex:"all"; }
function computeSelection(){
  const exam=currentExam();
  if($("#wrongChk").checked){
    const w=getWrongIds();
    const ids=S.bank.filter(q=>w.has(q.id)&&(exam==="all"||q.exam===exam)).map(q=>q.id);
    return {ids:new Set(ids),mode:"wrong"};
  }
  const rand=$("#randChk").checked;
  let groups=[]; // {section,group}
  $$(".type-card").forEach(card=>{
    if(!card.querySelector(".typechk").checked) return;
    const section=card.dataset.type;
    const tg=typeGroups(section,exam);
    let sel;
    if(rand){ sel=tg.slice(); }                       // 隨機模式：用全部，稍後抽
    else if(card.querySelector(".qp.on").dataset.preset==="all"){ sel=tg.slice(); }
    else{
      let s=parseInt(card.querySelector(".rng-start").value)||1;
      let e=parseInt(card.querySelector(".rng-end").value)||tg.length;
      s=Math.max(1,Math.min(s,tg.length)); e=Math.max(1,Math.min(e,tg.length));
      if(s>e){const t=s;s=e;e=t;}
      sel=tg.slice(s-1,e);
    }
    sel.forEach(g=>groups.push({section,group:g}));
  });
  if(rand){
    const n=Math.max(0,parseInt($("#randN").value)||0);
    groups=shuffle(groups).slice(0,n);
  }
  const gset=new Set(groups.map(x=>x.group));
  const ids=new Set(S.bank.filter(q=>gset.has(q.group)&&(exam==="all"||q.exam===exam)).map(q=>q.id));
  return {ids,mode:rand?"random":"range"};
}
function updateTypeCounts(){
  const exam=currentExam();
  $$(".type-card").forEach(card=>{
    const section=card.dataset.type, tg=typeGroups(section,exam);
    card.classList.toggle("off",!card.querySelector(".typechk").checked);
    const endInp=card.querySelector(".rng-end");
    if(endInp){ endInp.max=tg.length; if(!endInp.value) endInp.value=tg.length;
      card.querySelector(".rng-start").max=tg.length; }
    card.querySelector(".tcount").textContent=tg.length+" 篇";
  });
}
function updateSummary(){
  updateTypeCounts();
  const w=getWrongIds(); $("#wrongCount").textContent="（"+w.size+" 題）";
  const sel=computeSelection();
  let readN=0,clozeN=0;
  S.bank.forEach(q=>{ if(sel.ids.has(q.id)){ q.section==="閱讀測驗"?readN++:clozeN++; } });
  const total=readN+clozeN, mins=Math.max(1,Math.round(readN*1.2+clozeN*0.6));
  const sm=$("#summary");
  if(total===0){ sm.className="summary bad"; sm.textContent="目前選到 0 題，請勾選題型或調整範圍"; return false; }
  sm.className="summary";
  const parts=[]; if(readN)parts.push("閱讀 "+readN+" 題"); if(clozeN)parts.push("克漏字 "+clozeN+" 題");
  sm.innerHTML="已選 "+parts.join("、")+"<br>共 <b>"+total+"</b> 題 · 預估 <b>"+mins+"</b> 分鐘";
  return true;
}
function setupPicker(){
  updateTypeCounts();
  const inputs=()=>updateSummary();
  $("#examSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
    $$("#examSeg button").forEach(x=>x.classList.remove("on"));b.classList.add("on");
    $$(".type-card .rng-end").forEach(i=>i.value="");updateSummary();});
  $$(".type-card").forEach(card=>{
    card.querySelector(".typechk").addEventListener("change",inputs);
    card.querySelectorAll(".qp").forEach(qp=>qp.addEventListener("click",()=>{
      card.querySelectorAll(".qp").forEach(x=>x.classList.remove("on"));qp.classList.add("on");
      card.querySelector(".custom-range").classList.toggle("hidden",qp.dataset.preset!=="custom");
      updateSummary();
    }));
    card.querySelectorAll(".rng-start,.rng-end").forEach(i=>i.addEventListener("input",inputs));
  });
  $("#randChk").addEventListener("change",inputs);
  $("#randN").addEventListener("input",inputs);
  $("#wrongChk").addEventListener("change",inputs);
  updateSummary();
}

/* ---------- build session ---------- */
function makeRangeLabel(sel){
  let r=0,c=0;
  S.bank.forEach(q=>{ if(sel.ids.has(q.id)){ q.section==="閱讀測驗"?r++:c++; } });
  const parts=[]; if(r)parts.push("閱讀"+r+"題"); if(c)parts.push("克漏字"+c+"題");
  let base=parts.join("、")||"無";
  if(sel.mode==="wrong") base="只練錯題（"+base+"）";
  else if(sel.mode==="random") base="隨機（"+base+"）";
  const ex=currentExam(); if(ex!=="all") base="卷"+ex+" "+base;
  return base;
}
function buildGroups(){
  const ids=S.sessionIds instanceof Set ? S.sessionIds : new Set(S.sessionIds||[]);
  const pool=S.bank.filter(q=>ids.has(q.id));
  const m=new Map();
  for(const q of pool){
    if(!m.has(q.group)) m.set(q.group,{group:q.group,section:q.section,exam:q.exam,passage:q.passage,questions:[]});
    else if(!m.get(q.group).passage && q.passage) m.get(q.group).passage=q.passage;
    m.get(q.group).questions.push(q);
  }
  S.groups=Array.from(m.values());
  S.total=pool.length;
}

/* ---------- render current group ---------- */
function renderGroup(){
  const g=S.groups[S.idx]; if(!g)return;
  const isCloze=g.section==="克漏字測驗";
  const gt=$("#gtag"); gt.textContent=isCloze?"🧩 克漏字":"📖 閱讀測驗"; gt.className="chip "+(isCloze?"cloze":"read");
  $("#getag").textContent=g.exam==="A"?"卷 A":"卷 B";
  $("#artNo").textContent=(isCloze?"克漏字":"閱讀")+"　第 "+(S.idx+1)+" 篇";
  const pass=$("#passage");
  pass.className="passage"+(isCloze?"":" reading");
  pass.innerHTML=renderPassage(g.passage);

  const list=$("#qlist"); list.innerHTML="";
  g.questions.forEach((q,i)=>{
    const picked=S.answers[q.id]||null;
    const wrap=document.createElement("div"); wrap.className="qitem"; wrap.dataset.id=q.id;
    const done=picked?" done":"";
    let html='<div class="qhead"><span class="qn'+done+'">'+(picked?"✓":(i+1))+'</span>'+
             '<span class="'+(isCloze?'':'qen')+'">'+renderStem(q.question)+'</span></div>';
    const order=Object.keys(q.options).sort();
    order.forEach((L,k)=>{
      html+='<label class="choice" data-orig="'+L+'">'+
            '<input type="radio" name="r_'+q.id+'" value="'+L+'"'+(picked===L?' checked':'')+'>'+
            '<span class="rl">'+LETT[k]+'</span>'+
            '<span class="ct">'+renderOption(q.options[L])+'</span></label>';
    });
    html+='<div class="verdict"></div>';
    if(q.explanation && q.explanation.trim())
      html+='<div class="explain" style="display:none"><b>解析：</b>'+escapeHtml(q.explanation)+'</div>';
    wrap.innerHTML=html;
    list.appendChild(wrap);
  });
  list.querySelectorAll(".choice input").forEach(inp=>{
    inp.addEventListener("change",e=>{
      if(S.submitted&&!S.teacher) return;
      const item=e.target.closest(".qitem"), id=item.dataset.id;
      item.querySelectorAll(".choice").forEach(c=>c.classList.remove("sel"));
      e.target.closest(".choice").classList.add("sel");
      S.answers[id]=e.target.value;
      const qn=item.querySelector(".qn"); qn.classList.add("done"); qn.textContent="✓";
      save(); updateProgress();
    });
  });
  list.querySelectorAll(".choice input:checked").forEach(inp=>inp.closest(".choice").classList.add("sel"));
  $("#prevBtn").disabled=S.idx===0;
  $("#nextBtn").textContent=S.idx===S.groups.length-1?(S.submitted||S.review?"返回成績 →":"完成，交卷 →"):"下一篇 →";
  $("#jumpSel").value=S.idx;
  if(S.submitted||S.teacher) gradeGroupView();
  const ai=document.querySelector(".ans-inner"); if(ai) ai.scrollTop=0;
  window.scrollTo({top:0,behavior:"smooth"});
}

function buildJump(){
  const sel=$("#jumpSel"); sel.innerHTML="";
  S.groups.forEach((g,i)=>{
    const o=document.createElement("option"); o.value=i;
    o.textContent="第 "+(i+1)+" 篇（"+(g.section==="克漏字測驗"?"克漏字":"閱讀")+"・"+g.questions.length+"題）";
    sel.appendChild(o);
  });
  sel.onchange=()=>{ S.idx=+sel.value; save(); renderGroup(); };
}

function updateProgress(){
  let done=0; for(const id in S.answers) if(S.answers[id]) done++;
  $("#pcount").textContent=done+" / "+S.total;
  $("#pbar").style.width=(S.total?done/S.total*100:0)+"%";
  $("#cheer").textContent = done===0 ? "" : (done===S.total ? "全部完成啦！🎊" : CHEERS[Math.min(CHEERS.length-1,Math.floor(done/S.total*CHEERS.length))]);
}

/* ---------- grading view ---------- */
function gradeGroupView(){
  const g=S.groups[S.idx]; if(!g)return;
  $$("#qlist .qitem").forEach(item=>{
    const id=item.dataset.id, ans=S.key[id], picked=S.answers[id]||null;
    item.querySelectorAll(".choice").forEach(c=>{
      const L=c.dataset.orig;
      c.classList.remove("correct","wrong","key");
      if(S.submitted){
        if(L===ans) c.classList.add("correct");
        if(picked&&L===picked&&picked!==ans) c.classList.add("wrong");
        c.querySelector("input").disabled=!S.teacher;
      }else if(S.teacher){
        if(L===ans) c.classList.add("key");
      }
    });
    const v=item.querySelector(".verdict");
    if(S.submitted){
      if(picked===ans){v.className="verdict r";v.textContent="✓ 答對了！";}
      else if(picked){v.className="verdict w";v.textContent="再看看～正解是 "+ans;}
      else{v.className="verdict w";v.textContent="這題還沒作答（正解 "+ans+"）";}
    }else v.textContent="";
    const ex=item.querySelector(".explain");
    if(ex) ex.style.display=(S.submitted||S.teacher)?"block":"none";
  });
}

/* ---------- start / resume ---------- */
function readStudent(){ S.student.name=$("#inName").value.trim(); }
function validate(){
  const el=$("#f-name");
  if(!S.student.name){ el.classList.add("err"); return false; }
  el.classList.remove("err"); return true;
}
function showWho(){
  $("#hi").classList.remove("hidden");
  $("#hi").innerHTML="Hi, <b>"+escapeHtml(S.student.name)+"</b> 👋";
}
$("#startBtn").addEventListener("click",()=>{
  if(!S.bank){alert("題庫還在載入，稍等一下下～");return;}
  readStudent();
  if(!validate()) return;
  const sel=computeSelection();
  if(sel.ids.size===0){ updateSummary(); $("#summary").scrollIntoView({behavior:"smooth",block:"center"}); return; }
  S.sessionIds=sel.ids;
  S.rangeLabel=makeRangeLabel(sel);
  S.formSent=false;
  S.answers={}; S.idx=0; S.submitted=false; S.review=false;
  buildGroups(); buildJump(); showWho();
  $("#start").classList.add("hidden"); $("#result").classList.add("hidden");
  $("#quiz").classList.remove("hidden"); $("#submitBtn").classList.remove("hidden");
  updateProgress(); renderGroup(); save();
});
function resume(sv){
  S.student=sv.student||{name:""}; S.sessionIds=new Set(sv.sessionIds||[]); S.answers=sv.answers||{};
  if(S.sessionIds.size===0){ return; }
  buildGroups(); buildJump(); showWho();
  S.idx=Math.min(sv.idx||0,Math.max(0,S.groups.length-1));
  S.submitted=!!sv.submitted;
  $("#start").classList.add("hidden"); $("#submitBtn").classList.remove("hidden");
  if(S.submitted){ showResult(true); }
  else{ $("#quiz").classList.remove("hidden"); updateProgress(); renderGroup(); }
}

/* ---------- nav ---------- */
$("#prevBtn").addEventListener("click",()=>{ if(S.idx>0){S.idx--;save();renderGroup();} });
$("#nextBtn").addEventListener("click",()=>{
  if(S.idx<S.groups.length-1){ S.idx++; save(); renderGroup(); }
  else if(S.submitted||S.review){ showResult(true); }
  else { doSubmit(); }
});

/* ---------- submit ---------- */
$("#submitBtn").addEventListener("click",doSubmit);
function doSubmit(){
  let done=0; for(const id in S.answers) if(S.answers[id]) done++;
  if(!S.submitted && done<S.total && !confirm("還有 "+(S.total-done)+" 題沒作答，確定要交卷嗎？")) return;
  S.submitted=true; S.review=false;
  // 記錄錯題（供「只練錯題」）
  const wrong=[];
  for(const g of S.groups) for(const q of g.questions) if(S.answers[q.id]!==S.key[q.id]) wrong.push(q.id);
  addWrongIds(wrong);
  // 自動回報老師（Google 表單，靜默送出）
  if(!S.formSent){ const sc=computeScore(); reportToTeacher(sc); S.formSent=true; }
  save(); showResult(false);
}
function computeScore(){
  let correct=0;
  for(const g of S.groups) for(const q of g.questions) if(S.answers[q.id]===S.key[q.id]) correct++;
  const total=S.total, wrong=total-correct, rate=total?Math.round(correct/total*100):0;
  return {total,correct,wrong,rate};
}
function reportToTeacher(sc){
  if(!GFORM.id) return false;
  try{
    const fd=new FormData();
    fd.append(GFORM.fields.name,    S.student.name||"");
    fd.append(GFORM.fields.range,   S.rangeLabel||"");
    fd.append(GFORM.fields.total,   String(sc.total));
    fd.append(GFORM.fields.correct, String(sc.correct));
    fd.append(GFORM.fields.wrong,   String(sc.wrong));
    fd.append(GFORM.fields.rate,    sc.rate+"%");
    fetch("https://docs.google.com/forms/d/e/"+GFORM.id+"/formResponse",
          {method:"POST",mode:"no-cors",body:fd});
    return true;
  }catch(e){ return false; }
}
function cheerFor(rate){
  if(rate>=90) return {emoji:"🏆",msg:"太厲害了！繼續保持！"};
  if(rate>=80) return {emoji:"🌟",msg:"表現很棒！"};
  if(rate>=70) return {emoji:"💪",msg:"再努力一點就更好了！"};
  return {emoji:"🌱",msg:"別灰心，再練習一次吧！"};
}
function showResult(skipAnim){
  let correct=0;
  for(const g of S.groups) for(const q of g.questions) if(S.answers[q.id]===S.key[q.id]) correct++;
  const total=S.total, wrong=total-correct, rate=total?Math.round(correct/total*100):0;
  $("#rStu").textContent="姓名："+S.student.name;
  $("#rTotal").textContent=total; $("#rCorrect").textContent=correct;
  $("#rWrong").textContent=wrong; $("#rRate").textContent=rate+"%";
  const cf=cheerFor(rate);
  $("#congratsEmoji").textContent=cf.emoji; $("#cheerMsg").textContent=cf.msg;
  $("#sentNote").classList.toggle("hidden", !(S.formSent && GFORM.id));
  $("#quiz").classList.add("hidden"); $("#start").classList.add("hidden");
  $("#result").classList.remove("hidden"); $("#submitBtn").classList.add("hidden");
  const ring=$("#ring"), C=465, off=C-C*rate/100;
  ring.style.stroke = rate>=80?"var(--ok)":rate>=70?"var(--blue)":"var(--bad)";
  if(skipAnim){ ring.style.transition="none"; ring.style.strokeDashoffset=off; $("#rScore").textContent=rate; }
  else{
    ring.style.strokeDashoffset=C;
    let s=0,step=Math.max(1,Math.round(rate/40));
    const t=setInterval(()=>{s=Math.min(rate,s+step);$("#rScore").textContent=s;if(s>=rate)clearInterval(t);},20);
    setTimeout(()=>{ring.style.transition="stroke-dashoffset 1.1s ease";ring.style.strokeDashoffset=off;},80);
  }
  window.scrollTo({top:0,behavior:"smooth"});
}
$("#retryBtn").addEventListener("click",()=>{
  if(!confirm("再玩一次會清除這次的作答喔，確定嗎？"))return;
  localStorage.removeItem(SKEY);
  S.answers={};S.idx=0;S.submitted=false;S.review=false;
  $("#result").classList.add("hidden"); $("#start").classList.remove("hidden");
  $("#hi").classList.add("hidden"); $("#resumeNote").innerHTML="";
  $("#inName").value=S.student.name;
});
$("#reviewBtn").addEventListener("click",()=>{
  S.review=true; S.idx=0;
  $("#result").classList.add("hidden"); $("#quiz").classList.remove("hidden");
  $("#submitBtn").classList.add("hidden");
  renderGroup();
});

/* ---------- teacher ---------- */
$("#teacherBtn").addEventListener("click",()=>{
  if(S.teacher){
    S.teacher=false; document.body.classList.remove("teacher");
    $("#teacherBtn").classList.remove("on"); $("#teacherBtn").textContent="老師";
    if(S.groups.length && !$("#quiz").classList.contains("hidden")) renderGroup();
    return;
  }
  openModal();
});
function openModal(){
  const bg=document.createElement("div"); bg.className="modal-bg";
  bg.innerHTML=
    '<div class="modal"><div class="mh">👩‍🏫 老師登入</div><div class="mb">'+
    '<p>輸入密碼即可查看正解、解析與學生作答。</p>'+
    '<input id="pwIn" type="password" inputmode="numeric" placeholder="請輸入密碼" maxlength="12">'+
    '<div class="err-msg" id="pwErr"></div>'+
    '<div class="mbtns"><button id="pwCancel">取消</button><button class="primary" id="pwOk">登入</button></div>'+
    '</div></div>';
  document.body.appendChild(bg);
  const close=()=>bg.remove();
  bg.addEventListener("click",e=>{if(e.target===bg)close();});
  $("#pwCancel").onclick=close;
  const tryLogin=()=>{
    if($("#pwIn").value===TEACHER_PW){
      S.teacher=true; document.body.classList.add("teacher");
      $("#teacherBtn").classList.add("on"); $("#teacherBtn").textContent="老師模式 ✓";
      close();
      if(S.groups.length && !$("#quiz").classList.contains("hidden")) renderGroup();
    }else{ $("#pwErr").textContent="密碼不對，再試一次"; $("#pwIn").value=""; $("#pwIn").focus(); }
  };
  $("#pwOk").onclick=tryLogin;
  $("#pwIn").addEventListener("keydown",e=>{if(e.key==="Enter")tryLogin();});
  $("#pwIn").focus();
}

boot();
</script>
</body>
</html>
